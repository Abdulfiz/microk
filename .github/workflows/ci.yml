name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm make
      - name: Build
        run: make
      - name: Run tests in QEMU
        run: make test
